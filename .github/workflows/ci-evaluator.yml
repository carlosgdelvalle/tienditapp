name: evaluator-v05
on:
  pull_request:
    paths:
      - "Dockerfile.evaluator"
      - "railway.json"
      - "prototypes/tiendita-inteligente-pey-v0.4/**"
      - "assets/branding/**"
      - ".github/workflows/ci-evaluator.yml"
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias del prototipo
        working-directory: prototypes/tiendita-inteligente-pey-v0.4
        run: pip install -r requirements-dev.txt
      - name: Pruebas PEY simuladas y lógica de la app
        working-directory: prototypes/tiendita-inteligente-pey-v0.4
        run: python -m pytest -q test_flujos.py test_pey_integracion.py test_v04.py test_live_evaluator.py test_v05.py
      - name: Sintaxis JavaScript
        working-directory: prototypes/tiendita-inteligente-pey-v0.4
        run: |
          node --check static/app.js
          node --check static/empleado.js
      - name: Verificar ruta de branding
        working-directory: prototypes/tiendita-inteligente-pey-v0.4
        run: |
          python - <<'PY'
          import os
          os.environ.pop('PEY_ENABLE_LIVE', None)
          from fastapi.testclient import TestClient
          from app import app
          c = TestClient(app)
          assert c.get('/api/health').status_code == 200
          assert c.get('/branding/logo.jpeg').status_code == 200
          assert 'Abarpay' in c.get('/empleado').text
          assert 'Abarpay' in c.get('/').text
          print('Smoke branding y salud: OK (DEMO sin pagos)')
          PY
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen del evaluador
        run: docker build --file Dockerfile.evaluator --tag tienditapp-evaluator:pr .

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escaneo de secretos (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1

  servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar PostgreSQL para las pruebas del runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_initdb="$(find /usr/lib/postgresql -type f -name initdb -print -quit)"
          test -x "$pg_initdb"
          dirname "$pg_initdb" >> "$GITHUB_PATH"
      - name: Pruebas del backend v1
        run: |
          pip install -r server/requirements-dev.txt
          python -m pytest -q server/tests

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de la app
        run: |
          pip install -r app/requirements.txt
          python -m pytest -q app/tests
      - name: Pruebas aisladas del notificador de DSH
        run: python -m pytest -q scripts/tests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Android SDK 35
        uses: android-actions/setup-android@v3
      - name: Pruebas unitarias y ensamblado release
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleRelease

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abarpay_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PostgreSQL para pruebas aisladas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Aplicar migraciones 001-006
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d abarpay_dev -v ON_ERROR_STOP=1 -f migrations/001_schema.sql
          psql -h 127.0.0.1 -U postgres -d abarpay_dev -v ON_ERROR_STOP=1 -f migrations/002_seed.sql
          psql -h 127.0.0.1 -U postgres -d abarpay_dev -v ON_ERROR_STOP=1 -f migrations/003_onboarding.sql
          psql -h 127.0.0.1 -U postgres -d abarpay_dev -v ON_ERROR_STOP=1 -f migrations/004_owner_phone.sql
          psql -h 127.0.0.1 -U postgres -d abarpay_dev -v ON_ERROR_STOP=1 -f migrations/005_employee_phone.sql
          psql -h 127.0.0.1 -U postgres -d abarpay_dev -v ON_ERROR_STOP=1 -f migrations/006_offline_cash.sql
      - name: Instalar dependencias del servidor
        run: |
          python -m venv .venv
          .venv/bin/pip install -r server/requirements-dev.txt
      - name: Pruebas PostgreSQL (tenancy, aislamiento, migración)
        env:
          ABARPAY_PG_DSN: host=127.0.0.1 port=5432 dbname=abarpay_dev user=postgres password=postgres
        run: .venv/bin/python -m pytest -q server/tests/test_tenancy_pg.py server/tests/test_identity_pg.py server/tests/test_employee_phone_pg.py server/tests/test_offline_cash_pg.py
